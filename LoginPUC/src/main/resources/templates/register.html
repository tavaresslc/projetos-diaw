<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
    <div class="auth-container">
        <img th:src="@{/images/brasao-pucminas-2025-versao-positiva.png}" alt="brasao">
        <form th:action="@{/register}" method="post" class="auth-form">
            <h4 class="auth-title">Crie sua conta</h4>
            <input type="text" id="username" na me="username" placeholder="Username" required>
            <input type="email" id="email" name="email" placeholder="E-mail" required>
            <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
            <input type="text" id="rg" name="rg" placeholder="RG" required>
            <input type="text" id="endereco" name="endereco" placeholder="Endereço" required>
            <input type="text" id="instituicao" name="instituicao" placeholder="Instituição" required>
            <input type="password" id="password" name="password" placeholder="Senha" required>
            <div class="auth-button-container">
                <button type="submit">Register</button>
            </div>
            <p class="auth-redirect-options">
                Ainda não tem cadastro? <a href="/login">Faça login</a>
            </p>
        </form>
    </div>
</body>

</html>
